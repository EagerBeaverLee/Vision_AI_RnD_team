document_researching_task:
  description: >
    아래 지침에 따라 사용자 질문({user_question})에 답변하세요. 
    1. 사용자의 질문을 꼼꼼히 읽어보고 그 의도를 명확히 파악한 후 답변하세요.
    1. 검색 문서 기반 답변 작성: 반드시 검색된 문서의 정보만을 바탕으로 답변하세요.
    2. 추측 금지: 검색 문서에 관련 정보가 없거나 부족한 경우, 유추하거나 임의로 내용을 만들어내지 마세요. 
    3. 핵심 정보 선별: 여러 문서가 검색되더라도 질문 답변에 직접적으로 필요한 정보만 선별하여 사용하세요. 
  
  expected_output: >
    사용자의 의도를 잘 반영하고 검색된 적합한 문서에 기반한 구체적인 답변
    
  agent: document_researcher