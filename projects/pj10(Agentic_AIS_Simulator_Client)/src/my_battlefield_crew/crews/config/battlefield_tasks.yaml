#---------------------------------------
# 전장상황분석 TASKS (battlefield_crew.py)
#---------------------------------------
analyze_maritime_situation_task:
  description: >
    사용자의 전술 질문: "{user_question}"
    
    [🚨 임무 지침]
    당신은 현재 작전 지시관에 의해 지급된 분석 도구만을 활용하여 사용자의 질문에 답해야 합니다.
    지급된 도구(툴)는 이번 임무에 필요한 최적의 도구이므로, 장착된 도구들을 딱 한 번씩만 가동하여 데이터를 추출하십시오.
    그리고 답변 생성 시 툴을 실행하여 얻은 결과만을 활용하여 사용자의 질문에 적합한 답변을 생성하세요. 
    툴 실행 결과는 사용자의 질문에 답하는데 필요한 모든 내용을 포함하고 있다는 전제 하에 사용자의 질문에 답하세요.  
    주어진 데이터로부터 도출할 수 없는 내용은 과도하게 추론하지 마세요. 

    [⚠️ 무한 루프 방지 절대 수칙]
    - 툴을 1회 가동하여 결과 데이터를 얻었다면, 절대로 절대로 동일한 도구를 중복해서 다시 실행(Call)하지 마십시오!!!
    - 당신이 사용할 수 있는 도구가 제한되어 있으므로, 최종 Pydantic 객체(MaritimeSituationReport)에서 **이번 질문과 무관하여 데이터를 채울 수 없는 필드들은 억지로 채우려 하지 말고 반드시 `None` 또는 빈 리스트(`[]`) 상태 그대로 제출**하십시오.
    - 없는 데이터를 만들기 위해 도구를 무한 반복 가동하거나, 없는 도구를 억지로 호출하려고 시도하는 행위는 심각한 시스템 과부하를 유발하므로 절대 금지합니다.

    [정량 데이터 매핑 규칙]
    도구 실행 결과로 획득한 원시 데이터를 최종 Pydantic 객체의 해당 필드에 바인딩하십시오. 
    (데이터가 없는 나머지 필드는 안전하게 비워둡니다.)
    1. 'Maritime Zone Density Analyzer' 작동 시 -> 'top_dense_zones' 기입
    2. 'Maritime Zone Mean Speed Analyzer' 작동 시 -> 'zone_speeds' 기입
    3. 'Maritime Traffic Flow Analyzer' 작동 시 -> 'main_routes' 기입
    4. 'Maritime Traffic Direction Analyzer' 작동 시 -> 'main_directions' 기입
    5. 'Maritime Major Ports Status' 작동 시 -> 'port_activities' 기입
    6. 'Maritime Ships Voyage Status Analyzer' 작동 시 -> 'ship_voyage_status' 기입
    7. 'Maritime Unusual Ships Detector' 작동 시 -> 'unusual_ships' 기입

    [최종 전술 브리핑 작성 지침]
    데이터 매핑이 모두 완료되면, 다음 필드를 한글로 성의 있고 전문성 있게 작성하십시오:
    출력 결과 중 'weight' 가중치로 번역해 주세요!

    1.'final_answer': 질문과 직접적으로 매칭되는 데이터의 실측치(좌표, 척수, 속도 지표 등)를 조목조목 짚어가며, 질문에 대해 한 치의 오차도 없이 팩트 기반으로 답변하는 한글 서술문을 완성하십시오.
  expected_output: >
   "장착된 도구를 각 1회만 사용한 후 Tool Call을 종료하고, 해당 결과를 정밀 반영하여 스키마 규격에 맞춰 일부 필드가 완성된 순수 텍스트/JSON 기반의 최종 MaritimeSituationReport 객체"
  agent: maritime_situation_analyst



