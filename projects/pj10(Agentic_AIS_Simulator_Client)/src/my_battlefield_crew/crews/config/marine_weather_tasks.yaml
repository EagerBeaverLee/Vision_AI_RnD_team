#---------------------------------------------------
#  날씨분석 TASKS (@CrewBase; marine_weather_crew.py)
#---------------------------------------------------
generate_sql_task:
  description: >
    [기준 현재 시간]: {current_time}
    [사용자 질문]: "{user_query}"
    {feedback_prompt}

    사용자의 질문을 분석하여 아래의 DB 스키마와 규칙에 맞는 정확하고 최적화된 SQLite SELECT 쿼리를 생성하십시오.
    
    [Database Schema]
    - Table: buoy_master
    - Columns:
      * spot_id (INTEGER): 지점 번호 (예: 21229)
      * observed_at (TEXT): 일시 (YYYY-MM-DD HH:MM 또는 YYYY-MM-DD HH:MM:SS)
      * wind_speed (REAL): 풍속 (m/s)
      * wind_direction (REAL): 풍향 (deg, 0~360)
      * gust_wind_speed (REAL): GUST 풍속 (m/s)
      * pressure (REAL): 현지기압 (hPa)
      * humidity (REAL): 습도 (%)
      * air_temp (REAL): 기온 (°C)
      * water_temp (REAL): 수온 (°C)
      * max_wave_height (REAL): 최대파고 (m)
      * significant_wave_height (REAL): 유의파고 (m)
      * mean_wave_height (REAL): 평균파고 (m)
      * wave_period (REAL): 파주기 (sec)
      * wave_direction (REAL): 파향 (deg)
      * start_date (TEXT): 관측 시작일 (YYYY-MM-DD)
      * end_date (TEXT): 관측 종료일 (YYYY-MM-DD, 현재 운영 중인 경우 NULL 또는 공백)
      * spot_name (TEXT): 지점명 (예: '울릉도', '마라도', '포항')
      * address (TEXT): 지점 주소
      * office (TEXT): 관리관서 (예: '대구(구 143)', '부산지방기상청(159)', '인천기상대(112)')
      * latitude (REAL): 위도
      * longitude (REAL): 경도   

    [SQL 작성 핵심 규칙]
    1. 검색 및 필터링:
      - 지점명(spot_name) 및 관서명(office) 조회 시 모호성을 줄이기 위해 'LIKE '%이름%''을 적극 활용합니다.
      - 사용자의 질문에 명확한 지점명(예: 동해57, 남해111)이 포함된 경우 spot_name을 기준으로 SQL쿼리를 생성해 줘.
      - [날짜 및 시각 조회 규칙]:
          1) 질문에 '현재' 또는 '현재시점 기준'이라 명시되어 있거나 특정 시간/시각(예: 10시, 02:00 기준)까지 명시된 질문:
            - `DATETIME(observed_at) = DATETIME('2022-12-16 02:00:00')` 또는 `observed_at LIKE '2022-12-16 02%'` 구문을 사용하여 정확한 시각을 필터링합니다. (단순 `DATE()` 사용 금지)
          2) 특정 날짜 전체(예: 오늘, 12월 16일 하루)를 묻는 질문:
            - `DATE(observed_at) = DATE('2022-12-16')` 구문을 활용합니다.
      - '오늘' 조건은 `DATE(observed_at) = DATE('{self.state.current_time}')` 형태의 코리를 사용합니다. 
      [관리관서 및 시각 조회 규칙]
          1)사용자의 질문에 '관리관서'라고 언급된 경우 'office' 필드를 기준으로 SQL쿼리(e.g., office LIKE '%관서명%')를 생성하도록 해.
          [예시 쿼리]
          -- 질문: 현재 시간 기준 '강릉' 관리관서 소속 부이들의 실시간 기온 현황
            SELECT spot_name, spot_id, air_temp, observed_at, office
            FROM buoy_master
            WHERE office LIKE '%강릉%' AND observed_at LIKE '2022-12-16 14%' --[현재 기준 시간]이 2022-12-16 14:00인 경우
            ORDER BY air_temp DESC; 
      [시계열 변화량/드렌드 계산 규칙]
          1)"시간에 따른 변화량", "급감/급증", "최근 N시간 동안의 차이" 요구 시 단순 조회가 아닌 윈도우 함수(LAG) 또는 최초/최종값 차이의 집계(Aggregate)합니다.
          2)지점별(PARTITION BY spot_id)로 시간 순서(ORDER BY observed_at)를 정렬하여 과거 시점 값과 현재 시점 값의 차이(Delta = 현재 - 과거)를 계산합니다.
          3)데이터 수집 주기(예: 1시간 간격)를 고려하여 LAG(column, N) 단계를 적절히 지정하거나 MIN(observed_at)과 MAX(observed_at)의 값 차이를 비교합니다. 

    1. 조건 및 함수 규칙:
      - [최신/현재 데이터]: `ORDER BY observed_at DESC LIMIT 1` 패턴 사용.
      - [추이/변화 분석]: 단순히 1개만 뽑지 말고 최근 5~10개의 데이터를 시간순으로 반환 (`LIMIT 10`).
      - [지점 간 비교]: 비교 대상 지점들을 `spot_name LIKE '%A%' OR spot_name LIKE '%B%'` 조건으로 묶어 두 지점의 데이터를 모두 조회.
      - [일교차/극값 통계]: `MAX(air_temp) - MIN(air_temp) AS temp_range` 와 같이 집계함수와 GROUP BY(spot_name 등)를 적극 사용.
      - [NULL 처리 및 오름/내림 차순 정렬 규칙] 수온, 파고, 풍속 등 수치 데이터의 최소 또는 최대치를 조회할 때는 반드시 NULL 값을 제외하도록 조건절을 작성하세요.
        예를들면, WHERE water_temp IS NOT NULL 구문을 포함하여 NULL값으로 인하여 답변을 못하는 경우가 없도록 유의해줘! 
      - [비율/연산]: 파고 비율 등은 0으로 나누기 오류 방지를 위해 `(max_wave_height / NULLIF(significant_wave_height, 0))` 구문 활용.
      - [맥락/안전 질문]: 질문에서 "낚시/조업/안전/해무" 등을 물어보면 풍속, 파고, 수온, 기온, 습도 등 관련 핵심 인자를 가능하면 모두 SELECT절에 포함합니다.
      - 질문에 답변하는데 필요한 컬럼을 최대한 다 반환해줘. 예를들어 '울진에서 최대파고...시각이 언제야?'라는 질문에 대하여 시각만 반환하지 말고 최대파고 데이터도 반환하는 쿼리를 작성해야해! 
      - 북풍 계열 풍향 조건: `(wind_direction >= 315 OR wind_direction <= 45)`
  expected_output: >
    오직 실행 가능한 SQLite SELECT 쿼리문만 출력   
  agent: sql_generator_agent


validate_and_execute_sql_task:
  description: >
    다음 SQL 쿼리를 'Execute SQLite Query'도구로 실행하고 결과를 수집하세요:
    
    {generated_sql}
    
    [주의사항] 만약 도구 실행 결과 'SQL Error:'로 시작하는 에러 메시지가 반환되면, 
    절대로 이를 빈 결과로 포맷팅하지 말고 에러 메시지를 그대로 Final Answer에 포함하여 반환하세요.
  expected_output: >
    SQL 실행 결과를 포함하는 JSON 데이터 구조 또는 SQL Error 메시지
  agent: sql_executor_agent


generate_final_answer_task:
  description: >
    SQL 실행 결과를 분석하여 사용자의 질문('{user_query}')에 가장 적합한 최종 답변을 친절하게 작성하세요

    [수집된 DB 데이터]:
    {execution_result}

    [컬럼 정보 참고]
    각 필드가 의미하는 바는 다음과 같아. 답변을 생성할 때 필드명을 참고해서 답변해줘. 
    - Columns:
    * spot_id: 지점 번호 
    * observed_at: 일시
    * wind_speed: 풍속 (m/s)
    * wind_direction: 풍향 (deg, 0~360)
    * gust_wind_speed: GUST 풍속 (m/s)
    * pressure: 현지기압 (hPa)
    * humidity: 습도 (%)
    * air_temp: 기온 (°C)
    * water_temp: 수온 (°C)
    * max_wave_height: 최대파고 (m)
    * significant_wave_height: 유의파고 (m)
    * mean_wave_height: 평균파고 (m)
    * wave_period: 파주기 (sec)
    * wave_direction: 파향 (deg)
    * start_date: 관측 시작일 
    * end_date: 관측 종료일
    * spot_name: 지점명
    * address: 지점 주소
    * office: 관리관서
    * latitude: 위도
    * longitude: 경도   
  
    [답변생성규칙]
    - 사용자가 '동해', '서해' 등의 지역명만 언급한 경우, 완전 일치하는 지점명('동해', '서해') 데이터를 최우선으로 활용하여 답변을 생성합니다.
    - 완전히 일치하는 데이터 결과가 없는 경우에만 '동해57', '서해170' 등 숫자가 붙은 파생 지점 데이터를 사용하여 답변하세요.
    - '관리관서 소속된 부이'와 같은 내용이 사용자 질문에 포함된 경우 답변 생성시 검색된 모든 지점들의 데이터를 활용해서 답변을 생성하도록해.  
  expected_output: >
    사용자가 이해하기 쉬운 최종 답변  
  agent: data_analyst_agent