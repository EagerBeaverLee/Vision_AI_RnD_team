route_question_task:
  description: >
    사용자의 전술 질문: "{user_question}"

    당신은 지휘관의 질문을 분석하여 해상 전장 분석 시스템에서 가동할 카테고리 목록을 결정해야 합니다.
    아래 [🚨 카테고리 1:1 매핑 기준]을 꼼꼼하게 읽어보고 제대로 참고하여 라우팅 업무를 수행해줘!

    [🚨 카테고리 1:1 매핑 기준]
    - '전체상황 요약' ➡️ 종합 브리핑, 전반적인 전장 상황, 요약 보고
    - '밀집도 및 혼잡도' ➡️ 정박 밀도, 선박 밀집, 혼잡 구역
    - '주요 교통 흐름' ➡️ 주요 항로, 해상 교통선, 선박 흐름, 이동 방향, 평균 침로, 주요 이동 방향
    - '구역별 속도' ➡️ 평균 속도, 구역별 속도, 빠른 해역, 속도 지표
    - '주요 항만 입출항' ➡️ 주요 항만(예: 울산항, 부산항, 광양항 등등), 입출항 현황, 항구별 정박 현황
    - '기동 상태별 현황' ➡️ 선박 유형별, 기동 상태별, 정지/서행 선박
    - '특이 기동 선박 현황' ➡️ 이상 기동, 특이 기동, 지그재그 항해, 급선회, 급변속

    --------------------------------------------------
    [🚨 판별 프로세스 (단계별 적용)]

    1단계: 질문이 전반적인 해역 상황 요약/종합 브리핑을 요구하는가?
    ➡️ 맞다면 오직 `['전체상황 요약']` 단 하나만 선택하고 종료.

    2단계: 질문에 포함된 독립적인 분석 주제가 몇 개인가?
    - **단 1개의 주제만 포함된 경우 (단일 질문):**
        위 매핑 기준에 따라 **오직 해당되는 1개의 카테고리만 엄격히 선택**하십시오. 절대로 관련 없는 다른 카테고리를 추가하지 마십시오.
        (예: "현재 해역의 정박 밀도 알려줘" ➡️ `['밀집도 및 혼잡도']`)
        (예: "주요 항로 흐름 알려줘" ➡️ `['주요 교통 흐름']`)

    - **2개 이상의 주제가 포함된 경우 (복합 질문):**
        질문 속 각 주제에 해당하는 카테고리들을 **모두 누락 없이 선택**하십시오.
        (예: "주요 항로와 선박 밀집 현황, 평균 속도를 알려줘" ➡️ `['주요 교통 흐름', '밀집도 및 혼잡도', '구역별 속도']`)       
  expected_output: >
    지정된 AnalysisCategory 목록이 포함된 구조화된 분석 기획서
  agent: tactical_operations_router