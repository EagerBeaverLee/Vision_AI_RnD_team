master_route_task:
  description: >
    [사용자 질문]: "{user_question}"

    당신은 사용자의 질문을 분석하여 하위 분석 시스템 중 어떤 전문 Crew를 가동할지 결정해야 합니다. 

    [🚨 분류 및 1:1 매핑 기준]
    1. 'BattlefieldCrew'선택 기준:
      - 선박의 위치, 교통 흐름, 정박 밀집도, 이동 속도/침로, 기동 상태, 항로, 입출항 현황, 특이 기동 선박, 전장 상황 종합 브리핑 관련 질문

    2. 'MarineWeatherCrew' 선택 기준:
      - 해상 기온, 수온, 파고(유의파고/최대파고), 풍속, 풍향, 습도, 기압, 기상청 부이 관측 데이터 등 해상 날씨 관련 질문
      - 일반적인 날씨 정보를 물어보는 질문
      - 특정 해역의 현재 기상 조건이 활동에 적합한지(안전/위험 여부) 평가하거나, 기상 위험이 발생하는 공간적 지점/위치 탐색이 목적일 때
      - ⚠️ 주의: 질문에 날씨 단어가 포함되어 있더라도, 날씨 정보 조회가 목적이 아닌 '기상 조건에 따른 비상 조치/매뉴얼 판단' 질문은 MarineWeatherCrew가 아닌 'RagCrew'로 분류하십시오.
   
    3. 'RagCrew' 선택 기준:
      - 선박 운항/안전 매뉴얼, 비상 대응 수칙, 해양 사고 사례 및 재결서, 국제 해사 규정(IMSBC, SOLAS 등) 지식 기반 질의응답
      - 특정 기상(황천/태풍/파도 등)이나 비상 상황이 '전제 조건'으로 제시되어 선장/항해사의 의사결정, 매뉴얼상의 조치, 안전 규정, 기동술, 정비 지침을 묻는 질문
      - 복원성 계산, 횡경사, 침수, 화재, 좌초, 비상 단계(BLACK/RED 등), 퇴선 판단, 고속단정(Davit/후크/접안/구조) 운용 규정 관련 질문 
    
    4. 'unknown' 선택기준:
      - 위 세 경우에 해당되지 않고 명확하게 판단하기 어려운 질문

    [🚨 판별 프로세스]
    1. '질문의 의도'를 최우선 판단하십시오:
      - 질문이 "현재/미래의 실시간 상태(날씨/위치) 조회"인가? ➔ MarineWeatherCrew 또는 BattlefieldCrew
      - 질문이 "상황에 대한 법적/매뉴얼적 해석, 대응 행동 강령, 절차, 규정, 사고 판단 원칙"인가? ➔ RagCrew
    2. 질문 내에 '바람, 파고, 기상, 태풍, 황천' 등의 단어가 포함되어 있더라도, 결론적으로 '매뉴얼, 규정, 판단 기준, 조치 사항, 기동술'을 요구한다면 반드시 'RagCrew'를 선택하십시오.
  expected_output: >
    지정된 TargetCrew 값과 선택 이유(rationale)가 포함된 구조화된 라우팅 결과
  agent: master_operations_router