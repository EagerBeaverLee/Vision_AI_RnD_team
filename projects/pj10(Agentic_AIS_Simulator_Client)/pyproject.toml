[project]
name = "my_battlefield_crew"
version = "0.1.0"
description = "pmy_battlefield_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "bokeh>=3.9.2",
    "cartopy>=0.25.0,<0.26",
    "chainlit>=2.12.0",
    "chromadb>=1.1.1",
    "crewai[tools]>=1.14.7",
    "docx2txt>=0.9",
    "duckdb>=1.5.6",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.4",
    "folium>=0.20.0,<1.0.0",
    "geopandas>=1.1.4",
    "geoviews>=1.8.1",
    "holoviews>=1.23.2",
    "hvplot>=0.8.1",
    "kiwipiepy>=0.23.2",
    "langchain>=1.4.2",
    "langchain-chroma>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.2",
    "langchain-together>=0.4.0",
    "langfuse>=4.15.4",
    "litellm>=1.95.1",
    "matplotlib>=3.8.0,<3.9.0",
    "movingpandas>=0.23.0",
    "numpy>=1.26.0,<2.0.0",
    "openlit>=1.45.0",
    "pandas>=2.3.3",
    "plotly>=6.0.0,<7.0.0",
    "psutil>=7.2.2",
    "pypdf>=6.19.0",
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "streamlit==1.52.1",
    "streamlit-autorefresh>=1.0.1",
    "streamlit-folium>=0.26.0,<0.28.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "uvicorn>=0.53.0",
    "windrose>=1.9.0,<2.0.0",
]

[project.scripts]
kickoff = "my_battlefield_crew.main:kickoff"
run_crew = "my_battlefield_crew.main:kickoff"
plot = "my_battlefield_crew.main:plot"
run_with_trigger = "my_battlefield_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.hatch.build.targets.wheel]
packages = ["src/my_battlefield_crew"]
